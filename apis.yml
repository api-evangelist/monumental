name: Monumental
description: >-
  Monumental builds autonomous construction robots and the software that runs them. Its robots
  lay bricks and blockwork on real building sites, coordinated by Monumental's software platform
  (Atrium) and fleet operations (Fleet). The venture-backed company operates across the Netherlands,
  the United Kingdom, and the United States, and has raised multiple funding rounds (including a
  reported $32M raise and Series B rounds in the US and UK). Monumental was surfaced as a portfolio
  company of Northzone and added to the API Evangelist network. As of this profile the company
  publishes no public developer API, SDK, or API documentation - this record captures its identity
  and domain-security posture.
